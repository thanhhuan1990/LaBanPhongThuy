plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.huanhuynh.la_ban_phong_thuy"
    // Google Play: từ 31/08/2026 bản cập nhật phải target Android 16 (API 36) trở lên.
    compileSdk = Math.max(flutter.compileSdkVersion as int, 36)
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.huanhuynh.la_ban_phong_thuy"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

// ---- Phát hành lên Google Play (Gradle Play Publisher) ----
// Key service account để NGOÀI repo: ~/.config/play/huanhuynh-play.json (hoặc biến môi trường PLAY_CREDENTIALS).
// Không có key → bỏ qua. Upload AAB đã build bằng `flutter build appbundle`:
//   cd android && ./gradlew publishReleaseBundle --artifact-dir ../build/app/outputs/bundle/release
// Track internal, trạng thái nháp. Release note: src/main/play/release-notes/vi-VN/default.txt (≤ 500 ký tự).
def playCredentials = file(System.getenv("PLAY_CREDENTIALS") ?: "${System.getProperty('user.home')}/.config/play/huanhuynh-play.json")
if (playCredentials.exists()) {
    apply plugin: "com.github.triplet.play"
    play {
        serviceAccountCredentials.set(playCredentials)
        track.set("internal")
        releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.DRAFT)
        defaultToAppBundles.set(true)
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    implementation "com.google.firebase:firebase-analytics"
    // play-services-ads pulls work-runtime 2.7.0 (Room 2.2.5), whose WorkDatabase_Impl
    // constructor gets stripped by R8 full mode and crashes on startup.
    implementation "androidx.work:work-runtime:2.10.5"
}
